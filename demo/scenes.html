<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>场景 · 玖伴</title>
  <link rel="icon" type="image/png" href="assets/brand/logo.png" />
  <link rel="stylesheet" href="css/cartoon.css" />
</head>
<body>
  <header class="site-header" data-demo-header></header>

  <main class="page page-path">
    <section class="path-stage shell-stage" aria-label="情境对话">
      <div class="path-stage-glow shell-stage-glow" aria-hidden="true"></div>
      <h1>情境对话</h1>
      <p class="lead">挑一个日常情境，跟着对话走几轮——感受共情、分龄语气与安全守护。</p>
      <div class="path-stage-body">
        <div class="scene-grid" id="sceneGrid"></div>
      </div>
      <div class="shell-hero-actions footer-actions">
        <a class="btn btn-secondary btn-lg" href="companions.html">返回角色</a>
        <a class="btn btn-primary btn-lg" href="chat.html">去自由聊天</a>
      </div>
    </section>
  </main>

  <script src="js/store.js"></script>
  <script>
    const grid = document.getElementById("sceneGrid");
    DemoStore.scenes.forEach((s) => {
      const c = DemoStore.companions[s.companionId];
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "scene-card";
      const theme = s.prd || "";
      btn.innerHTML = `
        ${theme ? `<span class="theme-tag">${theme}</span>` : ""}
        <h3>${s.title}</h3>
        <p class="choice-desc" style="margin:0">${s.desc}</p>
        <p class="note" style="margin:0;text-align:left">伙伴：${c.name} · 模式：${s.mode === "child" ? "儿童" : "成人"} · ${s.turns.length} 轮</p>
        <span class="btn btn-primary" style="align-self:flex-start;pointer-events:none">进入对话</span>
      `;
      btn.addEventListener("click", () => {
        const patch = { mode: s.mode, companionId: s.companionId };
        if (s.seedLikes) {
          const cur = DemoStore.load().likes || [];
          patch.likes = Array.from(new Set([...cur, ...s.seedLikes]));
        }
        DemoStore.save(patch);
        location.href = "chat.html?scene=" + encodeURIComponent(s.id);
      });
      grid.appendChild(btn);
    });
  </script>
</body>
</html>
