<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>玖伴 · 九久相伴</title>
  <link rel="icon" type="image/png" href="assets/brand/logo.png" />
  <link rel="stylesheet" href="css/cartoon.css" />
</head>
<body class="page-home">
  <header class="site-header" data-demo-header data-brand="玖伴"></header>

  <section class="shell-hero" aria-label="玖伴">
    <div class="shell-hero-glow" aria-hidden="true"></div>
    <div class="shell-hero-inner">
      <img class="shell-hero-mark" src="assets/brand/logo.png" alt="" width="160" height="160" />
      <h1 class="shell-hero-brand">玖伴</h1>
      <p class="shell-hero-tagline">九久相伴，永远有人回应</p>
      <p class="shell-hero-lead">不是更快的 ChatGPT，是更好懂的伙伴。打开就能聊。</p>
      <div class="shell-hero-actions">
        <a class="btn btn-primary btn-lg" href="welcome.html">开始陪伴</a>
        <a class="btn btn-secondary btn-lg" href="chat.html">去聊天</a>
      </div>
    </div>
  </section>

  <main class="page page-home-main">
    <section class="benefit-band" aria-labelledby="benefits-title">
      <h2 id="benefits-title" class="section-title">玖伴能为你做什么</h2>
      <ul class="benefit-list">
        <li>
          <strong>随时陪伴</strong>
          <span>零登录开箱即聊，打开就有人回应</span>
        </li>
        <li>
          <strong>安心边界</strong>
          <span>危险话题会温和转开，守护更严</span>
        </li>
        <li>
          <strong>记得你</strong>
          <span>昵称与喜好留在本机，下次还会提起</span>
        </li>
        <li>
          <strong>温暖不越界</strong>
          <span>可以说说心事，明确不做恋爱角色</span>
        </li>
      </ul>
    </section>

    <section class="explore-band" aria-labelledby="explore-title">
      <h2 id="explore-title" class="section-title">去探索</h2>
      <div class="hub-grid hub-grid-explore">
        <a class="hub-item" href="welcome.html">
          <span class="step">起步</span>
          <strong>欢迎</strong>
          <span>认识玖伴</span>
        </a>
        <a class="hub-item" href="nickname.html">
          <span class="step">档案</span>
          <strong>昵称与喜好</strong>
          <span>告诉伙伴怎么称呼你</span>
        </a>
        <a class="hub-item" href="companions.html">
          <span class="step">伙伴</span>
          <strong>官方角色</strong>
          <span>小暖、跳跳、阿茶</span>
        </a>
        <a class="hub-item" href="scenes.html">
          <span class="step">场景</span>
          <strong>情境对话</strong>
          <span>无聊、好奇与心事</span>
        </a>
        <a class="hub-item" href="chat.html">
          <span class="step">聊天</span>
          <strong>自由聊天</strong>
          <span>打字、话题卡</span>
        </a>
        <a class="hub-item" href="games.html">
          <span class="step">游戏</span>
          <strong>益智小游戏</strong>
          <span>七款本地可玩</span>
        </a>
        <a class="hub-item" href="memory.html">
          <span class="step">记忆</span>
          <strong>记忆面板</strong>
          <span>查看或清理</span>
        </a>
        <a class="hub-item" href="settings.html">
          <span class="step">设置</span>
          <strong>本地设置</strong>
          <span>模式与数据</span>
        </a>
      </div>
    </section>
  </main>

  <script src="js/store.js"></script>
</body>
</html>
