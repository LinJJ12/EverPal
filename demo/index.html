<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>演示导览 · 陪伴 Demo</title>
  <link rel="stylesheet" href="css/cartoon.css" />
</head>
<body>
  <nav class="demo-ribbon" aria-label="演示页面切换">
    <a href="index.html">导览</a>
    <a href="welcome.html">欢迎</a>
    <a href="mode.html">模式</a>
    <a href="nickname.html">昵称</a>
    <a href="companions.html">角色</a>
    <a href="chat.html">聊天</a>
    <a href="settings.html">设置</a>
  </nav>

  <main class="phone">
    <div class="hero">
      <div class="hero-mascot" aria-hidden="true"></div>
      <h1>陪伴 Demo</h1>
      <p class="lead">纯 HTML 多页演示。可按下方流程走一遍，也可点顶部条任意跳转。</p>
    </div>

    <section class="card stack">
      <p class="note" style="text-align:left;margin:0">演示路径（推荐顺序）</p>
      <div class="hub-list">
        <a class="hub-item" href="welcome.html">
          <div>
            <strong>1. 欢迎页</strong>
            <span>品牌与开场，零登录</span>
          </div>
          <span>→</span>
        </a>
        <a class="hub-item" href="mode.html">
          <div>
            <strong>2. 儿童 / 成人模式</strong>
            <span>分龄语气与安全强度</span>
          </div>
          <span>→</span>
        </a>
        <a class="hub-item" href="nickname.html">
          <div>
            <strong>3. 昵称（可选）</strong>
            <span>轻量记忆入口</span>
          </div>
          <span>→</span>
        </a>
        <a class="hub-item" href="companions.html">
          <div>
            <strong>4. 选择陪伴角色</strong>
            <span>小暖 / 跳跳 / 阿茶</span>
          </div>
          <span>→</span>
        </a>
        <a class="hub-item" href="chat.html">
          <div>
            <strong>5. 聊天主界面</strong>
            <span>话题卡片 + 模拟回复</span>
          </div>
          <span>→</span>
        </a>
        <a class="hub-item" href="settings.html">
          <div>
            <strong>6. 本地设置</strong>
            <span>切模式、清记忆（无登录）</span>
          </div>
          <span>→</span>
        </a>
      </div>
    </section>

    <p class="note">本 Demo 不接真实大模型，仅用于界面与流程演示。</p>
    <a class="btn btn-primary btn-block" href="welcome.html">从欢迎页开始</a>
  </main>

  <script src="js/store.js"></script>
</body>
</html>
