<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>选择角色 · 玖伴 Demo</title>
  <link rel="stylesheet" href="css/cartoon.css" />
</head>
<body>
  <header class="site-header" data-demo-header></header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1>今天想找谁聊？</h1>
        <p class="lead" style="margin:0">对应 PRD「官方陪伴角色 ≥3」。请展开读一下人设与开场白，再进入场景——不要一闪而过。</p>
      </div>
      <span class="chip">无恋爱角色</span>
    </div>

    <div class="companion-grid" id="list"></div>

    <div class="footer-actions">
      <a class="btn btn-secondary" href="nickname.html">上一步</a>
      <a class="btn btn-mint" href="scenes.html">下一步：场景剧本 ★</a>
      <a class="btn btn-secondary" href="chat.html">或先自由聊</a>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script>
    const state = DemoStore.load();
    const list = document.getElementById("list");

    function render() {
      list.innerHTML = "";
      Object.values(DemoStore.companions).forEach((c) => {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "companion" + (state.companionId === c.id ? " selected" : "");
        el.innerHTML = `
          <div class="avatar ${c.id}">${DemoStore.avatarSvg(c.id)}</div>
          <div class="companion-meta">${c.role}</div>
          <div>
            <div class="choice-title">${c.name}${state.companionId === c.id ? " · 已选" : ""}</div>
            <div class="choice-desc">${c.blurb}</div>
            <div class="sample-line">「${DemoStore.companionOpener(c)}」</div>
          </div>
        `;
        el.addEventListener("click", () => {
          state.companionId = c.id;
          DemoStore.save({ companionId: c.id });
          render();
        });
        list.appendChild(el);
      });
    }
    render();
  </script>
</body>
</html>
