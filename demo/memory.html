<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>记忆 · 玖伴</title>
  <link rel="icon" type="image/png" href="assets/brand/logo.png" />
  <link rel="stylesheet" href="css/cartoon.css" />
</head>
<body>
  <header class="site-header" data-demo-header></header>

  <main class="page page-path">
    <section class="path-stage shell-stage" aria-label="轻量记忆">
      <div class="path-stage-glow shell-stage-glow" aria-hidden="true"></div>
      <h1>轻量记忆</h1>
      <p class="lead">昵称、喜好与近期摘要留在本机，可随时查看或清除。</p>
      <div class="path-stage-body">
        <section class="card stack">
          <div class="choice-title">档案摘要</div>
          <p class="note" style="margin:0" id="summary">—</p>
          <div class="tag-cloud" id="likeTags"></div>
        </section>
        <section class="card stack">
          <div class="choice-title">近期记忆条</div>
          <div class="memory-list" id="memList"></div>
          <p class="note" id="clearHint" hidden style="margin:0;text-align:left;color:var(--color-secondary)" role="status" aria-live="polite"></p>
          <button type="button" class="btn btn-secondary btn-block" id="clearMem">清除记忆条（保留昵称）</button>
        </section>
      </div>
      <div class="shell-hero-actions footer-actions">
        <a class="btn btn-secondary btn-lg" href="nickname.html">去改档案</a>
        <a class="btn btn-primary btn-lg" href="chat.html">回聊天</a>
      </div>
    </section>
  </main>

  <script src="js/store.js"></script>
  <script>
    let clearHintTimer = 0;
    function refresh() {
      const s = DemoStore.load();
      const likes = DemoStore.likeLabels();
      document.getElementById("summary").textContent =
        `昵称：${s.nickname || "（未设）"} · 未成年人陪伴 · 伙伴：${DemoStore.companion().name}`;
      const tags = document.getElementById("likeTags");
      tags.replaceChildren();
      if (likes.length) {
        likes.forEach((l) => {
          const tag = document.createElement("span");
          tag.className = "tag on";
          tag.textContent = l;
          tags.appendChild(tag);
        });
      } else {
        const note = document.createElement("span");
        note.className = "note";
        note.textContent = "还没有喜好标签，可在「档案」页点选。";
        tags.appendChild(note);
      }
      const list = document.getElementById("memList");
      const memories = s.memories || [];
      if (!memories.length) {
        list.innerHTML = `<p class="note" style="margin:0">暂无记忆条。在聊天或场景里产生的摘要会出现在这里。</p>`;
        return;
      }
      list.replaceChildren();
      memories.forEach((m) => {
        const row = document.createElement("div");
        row.className = "memory-item";
        const text = document.createElement("div");
        text.textContent = m.text || "";
        const time = document.createElement("time");
        time.textContent = new Date(m.ts).toLocaleString();
        row.append(text, time);
        list.appendChild(row);
      });
    }
    document.getElementById("clearMem").addEventListener("click", () => {
      const ok = confirm("确定清除近期记忆条？昵称与喜好会保留。");
      if (!ok) return;
      DemoStore.save({ memories: [] });
      refresh();
      const hint = document.getElementById("clearHint");
      hint.hidden = false;
      hint.textContent = "已清除记忆条，昵称与喜好仍保留";
      clearTimeout(clearHintTimer);
      clearHintTimer = setTimeout(() => {
        hint.hidden = true;
        hint.textContent = "";
      }, 4000);
    });
    refresh();
  </script>
</body>
</html>
