<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>欢迎 · 玖伴</title>
  <link rel="icon" type="image/png" href="assets/brand/logo.png" />
  <link rel="stylesheet" href="css/cartoon.css" />
</head>
<body>
  <header class="site-header" data-demo-header></header>

  <main class="page page-welcome">
    <section class="welcome-stage" aria-label="欢迎">
      <div class="welcome-stage-glow" aria-hidden="true"></div>
      <div class="welcome-presence">
        <div class="welcome-avatar avatar" id="avatar"></div>
        <p class="welcome-presence-name" id="compName">小暖</p>
        <p class="welcome-presence-note" id="compNote">在这儿等你</p>
      </div>
      <h1 id="title">你好呀，我在这儿</h1>
      <p class="lead" id="lead">玖伴是面向小孩与普通人的 AI 陪伴助手。</p>
      <div class="welcome-memory" id="memory" hidden></div>
      <div class="shell-hero-actions">
        <a class="btn btn-primary btn-lg" href="mode.html">选择模式</a>
        <a class="btn btn-secondary btn-lg" href="chat.html">直接聊天</a>
      </div>
    </section>

    <section class="welcome-next" aria-labelledby="next-title">
      <h2 id="next-title" class="section-title">接下来可以…</h2>
      <div class="hub-grid hub-grid-welcome">
        <a class="hub-item" href="mode.html">
          <span class="step">分龄</span>
          <strong>选择模式</strong>
          <span>儿童或成人，语气与守护强度不同</span>
        </a>
        <a class="hub-item" href="scenes.html">
          <span class="step">场景</span>
          <strong>先看情境</strong>
          <span>无聊、好奇、树洞——跟着聊几轮</span>
        </a>
        <a class="hub-item" href="companions.html">
          <span class="step">伙伴</span>
          <strong>换一位角色</strong>
          <span>小暖、跳跳、阿茶，今天想找谁</span>
        </a>
      </div>
    </section>
  </main>

  <script src="js/store.js"></script>
  <script>
    const g = DemoStore.welcomeGreeting();
    const c = DemoStore.companion();
    const likes = DemoStore.likeLabels();
    const state = DemoStore.load();

    document.getElementById("title").textContent = g.title;
    document.getElementById("lead").textContent = g.lead;

    const avatar = document.getElementById("avatar");
    avatar.classList.add(c.id);
    avatar.innerHTML = DemoStore.avatarSvg(c.id);
    document.getElementById("compName").textContent = c.name;
    document.getElementById("compNote").textContent =
      state.nickname || likes.length ? "记得你，一直在" : "打开就能聊，我在这儿";

    const memory = document.getElementById("memory");
    const bits = [];
    if (state.nickname) bits.push(`昵称 · ${state.nickname}`);
    if (state.mode === "child") bits.push("儿童模式");
    else if (state.mode === "adult") bits.push("成人模式");
    likes.slice(0, 3).forEach((label) => bits.push(label));
    if (bits.length) {
      memory.hidden = false;
      memory.replaceChildren();
      bits.forEach((b) => {
        const span = document.createElement("span");
        span.textContent = b;
        memory.appendChild(span);
      });
    }
  </script>
</body>
</html>
