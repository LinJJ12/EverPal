<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>欢迎 · 玖伴 Demo</title>
  <link rel="icon" type="image/png" href="assets/brand/logo.png" />
  <link rel="stylesheet" href="css/cartoon.css" />
</head>
<body>
  <header class="site-header" data-demo-header></header>

  <main class="page">
    <section class="hero-web">
      <div class="hero-copy">
        <span class="chip" id="eyebrow">无需登录 · 开箱即聊</span>
        <div class="hero-brand">
          <img class="hero-mark" src="assets/brand/logo.png" alt="" width="72" height="72" />
          <div>
            <h1 id="title">你好呀，我在这儿</h1>
          </div>
        </div>
        <p class="lead" id="lead">玖伴是面向小孩与普通人的 AI 陪伴助手。</p>
        <ul class="note" style="text-align:left;line-height:1.8;margin:0 0 20px;padding-left:1.2em">
          <li>不展示 API Key / 模型切换 / 温度旋钮</li>
          <li>儿童与成人两种陪伴语气</li>
          <li>可树洞倾诉，明确不做恋爱角色</li>
        </ul>
        <div class="hero-actions">
          <a class="btn btn-primary" href="mode.html">下一步：选择模式</a>
          <a class="btn btn-secondary" href="scenes.html">跳到场景剧本</a>
        </div>
      </div>
      <aside class="hero-aside" aria-label="品牌寓意">
        <p class="hero-aside-kicker">玖伴</p>
        <p class="hero-aside-line">九久相伴</p>
        <p class="hero-aside-line">永远有人回应</p>
        <p class="hero-aside-foot">先选模式，再留下昵称与喜好，场景里可以慢慢演。</p>
      </aside>
    </section>
  </main>

  <script src="js/store.js"></script>
  <script>
    const g = DemoStore.welcomeGreeting();
    document.getElementById("eyebrow").textContent = g.eyebrow;
    document.getElementById("title").textContent = g.title;
    document.getElementById("lead").textContent = g.lead;
  </script>
</body>
</html>
