<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>会话历史 · 玖伴</title>
  <link rel="icon" type="image/png" href="assets/brand/logo.png" />
  <link rel="stylesheet" href="css/cartoon.css" />
</head>
<body>
  <header class="site-header" data-demo-header></header>

  <main class="page page-path">
    <section class="path-stage shell-stage" aria-label="会话历史">
      <div class="path-stage-glow shell-stage-glow" aria-hidden="true"></div>
      <h1>会话历史</h1>
      <p class="lead">在聊天页点「保存本段对话」后，会出现在这里，方便回看。</p>
      <div class="path-stage-body">
        <div class="stack" id="list"></div>
        <p class="note" id="clearHint" hidden style="margin:12px 0 0;text-align:left;color:var(--color-secondary)" role="status" aria-live="polite"></p>
      </div>
      <div class="shell-hero-actions footer-actions">
        <button type="button" class="btn btn-secondary btn-lg" id="clearAll">清空历史</button>
        <a class="btn btn-primary btn-lg" href="chat.html">去聊天</a>
      </div>
    </section>
  </main>

  <script src="js/store.js"></script>
  <script>
    let clearHintTimer = 0;
    function refresh() {
      const sessions = DemoStore.load().sessions || [];
      const list = document.getElementById("list");
      if (!sessions.length) {
        list.innerHTML = `<section class="card"><p class="note" style="margin:0">还没有保存的会话。先去「场景」或「聊天」聊一段，再点保存。</p></section>`;
        return;
      }
      list.replaceChildren();
      sessions.forEach((s) => {
        const c = DemoStore.companions[s.companionId]?.name || "伙伴";
        const a = document.createElement("a");
        a.className = "history-item";
        a.href = "chat.html?session=" + encodeURIComponent(s.id);
        const strong = document.createElement("strong");
        strong.textContent = s.title || "未命名会话";
        const meta = document.createElement("div");
        meta.className = "note";
        meta.style.cssText = "margin:6px 0;text-align:left";
        meta.textContent = `${c} · 陪伴 · ${(s.messages || []).length} 条消息`;
        const time = document.createElement("time");
        time.textContent = new Date(s.updatedAt).toLocaleString();
        a.append(strong, meta, time);
        list.appendChild(a);
      });
    }
    document.getElementById("clearAll").addEventListener("click", () => {
      const ok = confirm("确定清空全部会话历史？此操作不可撤销。");
      if (!ok) return;
      DemoStore.save({ sessions: [] });
      refresh();
      const hint = document.getElementById("clearHint");
      hint.hidden = false;
      hint.textContent = "已清空会话历史";
      clearTimeout(clearHintTimer);
      clearHintTimer = setTimeout(() => {
        hint.hidden = true;
        hint.textContent = "";
      }, 4000);
    });
    refresh();
  </script>
</body>
</html>
