<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>聊天 · 玖伴</title>
  <link rel="stylesheet" href="css/cartoon.css" />
</head>
<body>
  <header class="site-header" data-demo-header></header>

  <main class="page page-chat">
    <div class="page-head" style="margin-bottom:16px">
      <div>
        <h1 id="pageTitle">聊天</h1>
        <p class="lead" style="margin:0" id="pageLead">随时聊聊。从场景进来时，可用「下一句」慢慢往下走。</p>
      </div>
      <span class="chip mode-badge" id="modeBadge">儿童模式</span>
    </div>

    <div class="chat-layout" id="chatLayout">
      <aside class="chat-side" id="chatSide" aria-label="伙伴与记忆">
        <h2>我的伙伴</h2>
        <div class="side-list" id="sideList"></div>
        <h2>本机记忆快照</h2>
        <p class="note" style="margin:0;text-align:left" id="sideNick"></p>
        <div class="tag-cloud" id="sideLikes"></div>
        <a class="btn btn-secondary btn-block" href="scenes.html">情境对话</a>
        <a class="btn btn-secondary btn-block" href="memory.html">记忆面板</a>
        <a class="btn btn-secondary btn-block" href="settings.html">本地设置</a>
      </aside>

      <section class="chat-shell">
        <button type="button" class="btn btn-secondary chat-side-toggle" id="sideToggle" aria-expanded="false" aria-controls="chatSide">
          伙伴 / 记忆
        </button>
        <div class="pace-bar" id="paceBar" hidden>
          <div>
            <strong id="paceTitle">场景播放</strong>
            <span class="note" id="paceProgress" style="margin-left:8px"></span>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="btn btn-primary" id="nextTurnBtn">下一句</button>
            <button type="button" class="btn btn-secondary" id="autoPlayBtn">自动慢放</button>
            <button type="button" class="btn btn-secondary" id="exitSceneBtn">退出场景</button>
          </div>
        </div>

        <header class="chat-header">
          <div class="mini-avatar" id="headerAvatar"></div>
          <div>
            <div style="font-weight:800;font-family:var(--font-display);font-size:1.15rem" id="headerName">小暖</div>
            <div style="font-size:0.85rem;color:var(--color-muted)" id="headerSub">我在呀</div>
          </div>
        </header>

        <div class="chat-toolbar">
          <button type="button" class="btn btn-secondary" id="stopBtn" disabled>停止生成</button>
          <button type="button" class="btn btn-secondary" id="regenBtn" disabled>重新生成上一句</button>
          <button type="button" class="btn btn-secondary" id="saveBtn">保存本段对话</button>
          <button type="button" class="btn btn-secondary" id="clearBtn">清空屏幕</button>
        </div>

        <div class="chat-messages" id="messages"></div>
        <div class="branch-choices" id="branchChoices" hidden></div>
        <div class="topics" id="topics"></div>

        <form class="composer" id="composer">
          <input id="input" type="text" placeholder="想说点什么…" autocomplete="off" aria-label="消息输入" />
          <button class="btn btn-primary" type="submit" id="sendBtn">发送</button>
        </form>
      </section>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const sceneId = params.get("scene");
    const sessionId = params.get("session");

    let state = DemoStore.load();
    let companion = DemoStore.companion();
    let nick = DemoStore.displayName();
    let log = [];
    let stopStream = null;
    let streamDelayTimer = null;
    let chatBusy = false;
    let lastBotText = "";
    let scene = null;
    let queue = [];
    let totalPlanned = 0;
    let played = 0;
    let awaitingChoice = false;
    let autoTimer = null;
    let sceneStreaming = false;

    const messagesEl = document.getElementById("messages");
    const topicsEl = document.getElementById("topics");
    const branchEl = document.getElementById("branchChoices");
    const paceBar = document.getElementById("paceBar");
    const nextTurnBtn = document.getElementById("nextTurnBtn");
    const autoPlayBtn = document.getElementById("autoPlayBtn");
    const stopBtn = document.getElementById("stopBtn");
    const regenBtn = document.getElementById("regenBtn");
    const chatLayout = document.getElementById("chatLayout");
    const sideToggle = document.getElementById("sideToggle");

    sideToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      const open = !chatLayout.classList.contains("side-open");
      chatLayout.classList.toggle("side-open", open);
      sideToggle.setAttribute("aria-expanded", open ? "true" : "false");
    });
    document.addEventListener("click", (e) => {
      if (!chatLayout.classList.contains("side-open")) return;
      if (e.target.closest(".chat-side") || e.target.closest("#sideToggle")) return;
      chatLayout.classList.remove("side-open");
      sideToggle.setAttribute("aria-expanded", "false");
    });

    function refreshChrome() {
      state = DemoStore.load();
      companion = DemoStore.companion();
      nick = DemoStore.displayName();
      const modeBadge = document.getElementById("modeBadge");
      modeBadge.textContent = state.mode === "child" ? "儿童模式" : "成人模式";
      modeBadge.className = "chip mode-badge " + state.mode;
      document.getElementById("headerAvatar").className = "mini-avatar avatar " + companion.id;
      document.getElementById("headerAvatar").innerHTML = DemoStore.avatarSvg(companion.id);
      document.getElementById("headerName").textContent = companion.name;
      const likes = DemoStore.likeLabels();
      const nickLabel = state.nickname || nick;
      document.getElementById("headerSub").textContent = likes.length
        ? `${nickLabel}，我记得你喜欢${likes.slice(0, 2).join("、")}～`
        : state.nickname
          ? state.mode === "child"
            ? `${state.nickname}，今天想听故事还是问问题？`
            : `${state.nickname}，我听着呢，你慢慢说。`
          : state.mode === "child"
            ? "今天想听故事还是问问题？"
            : "我听着呢，你慢慢说。";
      document.getElementById("sideNick").textContent = state.nickname
        ? `称呼：${state.nickname}`
        : "称呼：（未设）";
      const sideLikes = document.getElementById("sideLikes");
      if (likes.length) {
        sideLikes.replaceChildren();
        likes.forEach((l) => {
          const tag = document.createElement("span");
          tag.className = "tag on";
          tag.textContent = l;
          sideLikes.appendChild(tag);
        });
      } else {
        sideLikes.innerHTML = `<span class="note">还没有喜好，可去<a href="nickname.html">档案</a>点选</span>`;
      }

      const sideList = document.getElementById("sideList");
      sideList.innerHTML = "";
      Object.values(DemoStore.companions).forEach((c) => {
        const a = document.createElement("button");
        a.type = "button";
        a.className = "side-link" + (c.id === companion.id ? " active" : "");
        const av = document.createElement("span");
        av.className = "side-avatar avatar " + c.id;
        av.innerHTML = DemoStore.avatarSvg(c.id);
        const name = document.createElement("span");
        name.textContent = c.name;
        a.append(av, name);
        a.addEventListener("click", () => {
          if (scene) return alert("场景播放中，请先退出场景再换角色");
          DemoStore.save({ companionId: c.id });
          location.href = "chat.html";
        });
        sideList.appendChild(a);
      });
    }

    function setChatBusy(on) {
      chatBusy = !!on;
      if (scene) return;
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("sendBtn");
      input.disabled = chatBusy;
      sendBtn.disabled = chatBusy;
      topicsEl.querySelectorAll("button").forEach((btn) => {
        btn.disabled = chatBusy;
      });
      regenBtn.disabled = chatBusy || !lastBotText;
    }

    function cancelStream() {
      const hadDelay = !!streamDelayTimer;
      if (streamDelayTimer) {
        clearTimeout(streamDelayTimer);
        streamDelayTimer = null;
      }
      if (stopStream) {
        stopStream();
        stopStream = null;
      } else if (hadDelay) {
        const bots = messagesEl.querySelectorAll(".bubble.bot");
        const last = bots[bots.length - 1];
        if (last && !last.textContent.trim()) last.remove();
      }
      messagesEl.querySelectorAll(".typing").forEach((el) => el.remove());
      messagesEl.querySelectorAll(".bubble.streaming").forEach((el) => el.classList.remove("streaming"));
      stopBtn.disabled = true;
      if (!scene) setChatBusy(false);
      sceneStreaming = false;
    }

    function addBubble(text, who, opts) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      if (opts && opts.turnEnter) div.classList.add("turn-enter");
      messagesEl.appendChild(div);
      const scroll = () => {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      };
      if (who === "bot" && opts && opts.stream) {
        if (!scene) setChatBusy(true);
        const typing = document.createElement("div");
        typing.className = "typing";
        typing.innerHTML = "<span></span><span></span><span></span>";
        messagesEl.appendChild(typing);
        scroll();
        streamDelayTimer = setTimeout(() => {
          streamDelayTimer = null;
          if (!typing.isConnected) {
            if (!scene) setChatBusy(false);
            return;
          }
          typing.remove();
          stopBtn.disabled = false;
          div.classList.add("streaming");
          stopStream = DemoStore.streamText(div, text, {
            speed: state.mode === "child" ? 28 : 18,
            onTick: scroll,
            onDone: () => {
              div.classList.remove("streaming");
              stopBtn.disabled = true;
              stopStream = null;
              lastBotText = text;
              if (!scene) setChatBusy(false);
              else regenBtn.disabled = false;
              log.push({ role: who, text });
              if (opts.onDone) opts.onDone();
            },
          });
        }, 450);
      } else {
        div.textContent = text;
        log.push({ role: who, text });
        if (who === "bot") {
          lastBotText = text;
          regenBtn.disabled = !scene && chatBusy;
        }
        scroll();
        if (opts && opts.onDone) opts.onDone();
      }
      return div;
    }

    let freeTurn = 0;

    function freeReply(userText) {
      freeTurn += 1;
      // Prefer prior turns only: sendUser may have already pushed the current user bubble.
      const prior = log.length && log[log.length - 1].role === "user" && log[log.length - 1].text === userText
        ? log.slice(0, -1)
        : log;
      return DemoStore.freeReply(userText, {
        recent: prior.slice(-6),
        nick,
        mode: state.mode,
        likes: DemoStore.likeLabels(),
        freeTurn,
      });
    }

    function renderTopics() {
      topicsEl.innerHTML = "";
      if (scene) return;
      const topics =
        state.mode === "child"
          ? [
              { label: "今天好无聊", text: "今天好无聊啊……" },
              { label: "听个短故事", text: "我想听个短故事" },
              { label: "为什么天是蓝的", text: "为什么天是蓝的？" },
              { label: "假想太空探险", text: "我们假装去太空吧！" },
            ]
          : [
              { label: "说说今天", text: "今天开会开到很晚，整个人空空的。" },
              { label: "有点累", text: "好累，只想躺着，又觉得自己很废。" },
              { label: "想听句鼓励", text: "能给我一句不鸡汤的鼓励吗？" },
            ];
      topics.forEach((t) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "topic";
        btn.textContent = t.label;
        btn.addEventListener("click", () => sendUser(t.text));
        topicsEl.appendChild(btn);
      });
    }

    function sendUser(text) {
      if (scene || chatBusy) return;
      if (!text.trim()) return;
      addBubble(text.trim(), "user");
      const reply = freeReply(text.trim());
      if (/恐龙|画画|足球|小猫|宇宙|音乐|看书|小游戏|游戏/.test(text)) {
        DemoStore.addMemory(`提到兴趣相关：${text.slice(0, 24)}`);
      }
      addBubble(reply, "bot", { stream: true });
    }

    document.getElementById("composer").addEventListener("submit", (e) => {
      e.preventDefault();
      if (chatBusy || scene) return;
      const input = document.getElementById("input");
      const text = input.value;
      input.value = "";
      sendUser(text);
    });

    stopBtn.addEventListener("click", () => {
      cancelStream();
      if (scene) updatePace();
    });

    regenBtn.addEventListener("click", () => {
      if (!lastBotText || scene || chatBusy) return;
      addBubble(lastBotText + "（换一种说法：）其实我想更慢一点陪你说完。", "bot", { stream: true });
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
      if (!log.length) return alert("还没有对话可保存");
      const title = scene ? scene.title : `与${companion.name}的对话`;
      DemoStore.saveSession(title, log);
      DemoStore.addMemory(`保存了对话「${title}」`);
      alert("已保存到「历史」页");
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      if (scene) return alert("请先退出场景");
      cancelStream();
      log = [];
      lastBotText = "";
      messagesEl.innerHTML = "";
      seedGreeting();
    });

    function seedGreeting() {
      const opener = DemoStore.companionOpener(companion);
      const likes = DemoStore.likeLabels();
      const s = DemoStore.load();
      if (s.nickname || likes.length) {
        const emptyHint = document.createElement("p");
        emptyHint.className = "note chat-empty-hint";
        emptyHint.style.cssText = "margin:0 0 4px;align-self:flex-start;max-width:90%";
        if (s.nickname && likes.length) {
          emptyHint.textContent = `记得你：${s.nickname} · 喜欢${likes.slice(0, 2).join("、")}`;
        } else if (s.nickname) {
          emptyHint.textContent = `记得你：${s.nickname}`;
        } else {
          emptyHint.textContent = `记得你喜欢${likes.slice(0, 2).join("、")}`;
        }
        messagesEl.appendChild(emptyHint);
      }
      addBubble(opener, "bot", { stream: true });
    }

    /* ——— Scene pacing with branches ——— */
    function applySceneProfile(s) {
      const patch = { mode: s.mode, companionId: s.companionId };
      if (s.seedLikes) {
        const cur = DemoStore.load().likes || [];
        patch.likes = Array.from(new Set([...cur, ...s.seedLikes]));
      }
      DemoStore.save(patch);
      refreshChrome();
    }

    function enterScene(s) {
      applySceneProfile(s);
      scene = s;
      sceneStreaming = false;
      queue = s.turns.map((t) => ({ ...t }));
      totalPlanned = queue.length;
      played = 0;
      awaitingChoice = false;
      log = [];
      messagesEl.innerHTML = "";
      branchEl.hidden = true;
      branchEl.innerHTML = "";
      paceBar.hidden = false;
      document.getElementById("pageTitle").textContent = "场景：" + s.title;
      document.getElementById("pageLead").textContent = s.prd
        ? `${s.prd} · 有选项时点一下，或用「下一句」继续`
        : `有选项时点一下，或用「下一句」继续`;
      document.getElementById("paceTitle").textContent = s.title;
      document.getElementById("composer").style.opacity = "0.45";
      document.getElementById("input").disabled = true;
      document.getElementById("sendBtn").disabled = true;
      nextTurnBtn.textContent = "下一句";
      updatePace();
      renderTopics();
    }

    function updatePace() {
      const left = queue.length;
      document.getElementById("paceProgress").textContent = awaitingChoice
        ? `请选一个继续（已聊 ${played} 句）`
        : sceneStreaming
          ? `打字中… · 已聊 ${played}`
          : `还剩 ${left} 句 · 已聊 ${played}`;
      nextTurnBtn.disabled = awaitingChoice || sceneStreaming || left === 0;
      if (!awaitingChoice && !sceneStreaming && left === 0 && played > 0) {
        nextTurnBtn.textContent = "聊完啦";
        nextTurnBtn.disabled = true;
      }
    }

    function showChoices(choices) {
      awaitingChoice = true;
      updatePace();
      branchEl.hidden = false;
      branchEl.innerHTML = "";
      choices.forEach((c) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "btn btn-primary";
        b.textContent = c.label;
        b.addEventListener("click", () => {
          awaitingChoice = false;
          branchEl.hidden = true;
          branchEl.innerHTML = "";
          addBubble(c.userText, "user");
          played += 1;
          const follow = (c.follow || []).map((t) => ({ ...t }));
          queue = follow.concat(queue);
          totalPlanned += follow.length;
          updatePace();
          DemoStore.addMemory(`场景里选了：${c.label}`);
        });
        branchEl.appendChild(b);
      });
    }

    function playNextTurn() {
      if (!scene || awaitingChoice || sceneStreaming || !queue.length) return;
      const turn = queue.shift();
      played += 1;
      updatePace();
      if (turn.role === "user") {
        addBubble(turn.text, "user", { turnEnter: true });
        if (!queue.length) {
          DemoStore.addMemory(`完成场景「${scene.title}」`);
          updatePace();
        }
        return true;
      }
      sceneStreaming = true;
      updatePace();
      addBubble(turn.text, "bot", {
        stream: true,
        turnEnter: true,
        onDone: () => {
          sceneStreaming = false;
          if (turn.choices && turn.choices.length) {
            showChoices(turn.choices);
          } else if (!queue.length) {
            DemoStore.addMemory(`完成场景「${scene.title}」`);
            updatePace();
          } else {
            updatePace();
          }
        },
      });
      return true;
    }

    nextTurnBtn.addEventListener("click", () => {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        autoPlayBtn.textContent = "自动慢放";
      }
      playNextTurn();
    });

    autoPlayBtn.addEventListener("click", () => {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        autoPlayBtn.textContent = "自动慢放";
        return;
      }
      autoPlayBtn.textContent = "停止慢放";
      const tick = () => {
        if (!scene || awaitingChoice || sceneStreaming) return;
        if (!queue.length) {
          clearInterval(autoTimer);
          autoTimer = null;
          autoPlayBtn.textContent = "自动慢放";
          return;
        }
        playNextTurn();
      };
      tick();
      autoTimer = setInterval(tick, 3600);
    });

    document.getElementById("exitSceneBtn").addEventListener("click", () => {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
      }
      cancelStream();
      location.href = "chat.html";
    });

    /* boot */
    refreshChrome();
    renderTopics();

    if (sessionId) {
      const sess = (DemoStore.load().sessions || []).find((x) => x.id === sessionId);
      if (sess) {
        DemoStore.save({ companionId: sess.companionId, mode: sess.mode });
        refreshChrome();
        document.getElementById("pageTitle").textContent = "回看：" + sess.title;
        sess.messages.forEach((m) => addBubble(m.text, m.role === "assistant" || m.role === "bot" ? "bot" : m.role));
        log = sess.messages.map((m) => ({
          role: m.role === "assistant" ? "bot" : m.role,
          text: m.text,
        }));
      } else {
        seedGreeting();
      }
    } else if (sceneId) {
      const s = DemoStore.scenes.find((x) => x.id === sceneId);
      if (s) enterScene(s);
      else seedGreeting();
    } else {
      seedGreeting();
    }
  </script>
</body>
</html>
