<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设置 · 玖伴</title>
  <link rel="icon" type="image/png" href="assets/brand/logo.png" />
  <link rel="stylesheet" href="css/cartoon.css" />
</head>
<body>
  <header class="site-header" data-demo-header></header>

  <main class="page page-path">
    <section class="path-stage shell-stage" aria-label="本地设置">
      <div class="path-stage-glow shell-stage-glow" aria-hidden="true"></div>
      <h1>本地设置</h1>
      <p class="lead">只保留陪伴相关选项——没有模型列表、温度或接口配置。数据都在本机，无需登录。</p>
      <div class="path-stage-body">
        <section class="card stack">
          <div>
            <div class="choice-title">当前档案</div>
            <p class="note" style="margin:8px 0 0" id="summary">—</p>
          </div>

          <div class="choice">
            <button type="button" class="choice-item" data-mode="child">
              <div class="choice-icon child" id="iconChild"></div>
              <div>
                <div class="choice-title">儿童模式</div>
                <div class="choice-desc">短句、更严守护</div>
              </div>
            </button>
            <button type="button" class="choice-item adult-tone" data-mode="adult">
              <div class="choice-icon adult" id="iconAdult"></div>
              <div>
                <div class="choice-title">成人模式</div>
                <div class="choice-desc">可轻度倾诉，非恋爱</div>
              </div>
            </button>
          </div>

          <button type="button" class="btn btn-secondary btn-block" id="resetBtn">重置演示</button>
          <p class="note" style="margin:0;text-align:left" id="resetHint">确认后恢复默认：儿童模式、空昵称、空喜好、小暖、无会话无记忆、无游戏纪录。</p>
        </section>
      </div>
      <div class="shell-hero-actions footer-actions">
        <a class="btn btn-secondary btn-lg" href="index.html">回首页</a>
        <a class="btn btn-primary btn-lg" href="scenes.html">去场景</a>
      </div>
    </section>
  </main>

  <script src="js/store.js"></script>
  <script>
    document.getElementById("iconChild").innerHTML = DemoStore.iconChild();
    document.getElementById("iconAdult").innerHTML = DemoStore.iconAdult();

    function refresh() {
      const s = DemoStore.load();
      const c = DemoStore.companion();
      const likes = DemoStore.likeLabels().join("、") || "无";
      document.getElementById("summary").textContent =
        `昵称：${s.nickname || "（未设置）"} · 模式：${s.mode === "child" ? "儿童" : "成人"} · 伙伴：${c.name} · 喜好：${likes} · 记忆 ${(s.memories || []).length} 条 · 历史 ${(s.sessions || []).length} 段`;
      document.querySelectorAll(".choice-item").forEach((el) => {
        el.classList.toggle("active", el.dataset.mode === s.mode);
      });
    }

    document.querySelectorAll(".choice-item").forEach((el) => {
      el.addEventListener("click", () => {
        DemoStore.save({ mode: el.dataset.mode });
        DemoStore.applyModeChrome();
        refresh();
      });
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      const ok = confirm("确定重置演示？将清除本机全部数据（含游戏纪录），并恢复默认（儿童 · 小暖 · 空档案）。");
      if (!ok) return;
      DemoStore.resetDemo();
      refresh();
      alert("已清空并恢复默认。档案、记忆、会话与游戏纪录均已重置。");
    });

    refresh();
  </script>
</body>
</html>
