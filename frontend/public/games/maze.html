<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>走迷宫 · 玖伴</title>
  <link rel="stylesheet" href="cartoon.css" />
  <link rel="stylesheet" href="games.css" />
</head>
<body>
  <main class="page game-page">
    <div class="game-toolbar">
      <a class="btn btn-secondary" href="/games">回大厅</a>
      <h1>走迷宫</h1>
      <button type="button" class="btn btn-primary" id="restartBtn">再来一局</button>
    </div>
    <div class="game-scores">
      <span>本局步数：<strong id="scoreNow">0</strong></span>
      <span>最佳步数：<strong id="scoreBest">暂无</strong></span>
    </div>
    <p class="game-hint">从左上角走到右下角的星星；方向键或下方按钮移动</p>
    <div id="gameMsg" class="game-msg" hidden></div>
    <div class="game-board-wrap">
      <canvas id="board" class="game-canvas" width="360" height="360" aria-label="迷宫"></canvas>
    </div>
    <div class="game-controls">
      <div class="pad" id="pad">
        <span class="ghost"></span>
        <button type="button" class="btn btn-secondary" data-dir="up" aria-label="上">↑</button>
        <span class="ghost"></span>
        <button type="button" class="btn btn-secondary" data-dir="left" aria-label="左">←</button>
        <button type="button" class="btn btn-secondary" data-dir="down" aria-label="下">↓</button>
        <button type="button" class="btn btn-secondary" data-dir="right" aria-label="右">→</button>
      </div>
    </div>
  </main>
  <script src="store.js"></script>
  <script src="games-common.js"></script>
  <script src="js/maze.js"></script>
</body>
</html>
