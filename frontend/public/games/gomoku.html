<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>五子棋 · 玖伴</title>
  <link rel="stylesheet" href="cartoon.css" />
  <link rel="stylesheet" href="games.css" />
</head>
<body>
  <main class="page game-page">
    <div class="game-toolbar">
      <a class="btn btn-secondary" href="/games">回大厅</a>
      <h1>五子棋</h1>
      <button type="button" class="btn btn-primary" id="restartBtn">再来一局</button>
    </div>
    <div class="game-scores">
      <span>本页胜场：<strong id="scoreNow">0</strong></span>
      <span>纪录：<strong id="scoreBest">0</strong></span>
    </div>
    <p class="game-hint">你执黑子先手，点棋盘落子；电脑会简单应对</p>
    <div id="gameMsg" class="game-msg" hidden></div>
    <div class="gomoku-wrap">
      <canvas id="board" width="390" height="390" aria-label="五子棋棋盘"></canvas>
    </div>
  </main>
  <script src="store.js"></script>
  <script src="games-common.js"></script>
  <script src="js/gomoku.js"></script>
</body>
</html>
